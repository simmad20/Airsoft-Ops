# Builds the Android app (Capacitor) on GitHub's servers, which have the Android SDK installed.
# Result (Actions -> run -> Artifacts):
#   airsoft-ops-release-aab  signed .aab for Google Play (only when the upload-key secrets are set)
#   airsoft-ops-debug-apk    .apk to install directly on a phone for testing
name: Android app

on:
  push:
    branches: [android]
    paths-ignore: ['play-store/**', '**.md']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HAS_UPLOAD_KEY: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm ci

      - name: Copy web app into the Android project
        run: npm run android:sync

      - name: Version
        id: version
        run: |
          echo "name=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
          # Google Play needs a higher versionCode for every upload: the run number always grows.
          echo "code=$(( ${{ github.run_number }} + 100 ))" >> "$GITHUB_OUTPUT"

      - name: Restore upload key
        if: env.HAS_UPLOAD_KEY == 'true'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/upload-key.jks

      - name: Build debug APK
        working-directory: android
        env:
          VERSION_CODE: ${{ steps.version.outputs.code }}
          VERSION_NAME: ${{ steps.version.outputs.name }}
        run: ./gradlew --no-daemon assembleDebug

      - name: Build signed release bundle (.aab)
        if: env.HAS_UPLOAD_KEY == 'true'
        working-directory: android
        env:
          VERSION_CODE: ${{ steps.version.outputs.code }}
          VERSION_NAME: ${{ steps.version.outputs.name }}
          ANDROID_KEYSTORE_FILE: upload-key.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew --no-daemon bundleRelease

      - name: Remove upload key
        if: always()
        run: rm -f android/upload-key.jks

      - uses: actions/upload-artifact@v4
        with:
          name: airsoft-ops-debug-apk-${{ steps.version.outputs.name }}-${{ steps.version.outputs.code }}
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: env.HAS_UPLOAD_KEY == 'true'
        with:
          name: airsoft-ops-release-aab-${{ steps.version.outputs.name }}-${{ steps.version.outputs.code }}
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error

      - name: Summary
        run: |
          {
            echo "### Airsoft Ops ${{ steps.version.outputs.name }} (versionCode ${{ steps.version.outputs.code }})"
            if [ "$HAS_UPLOAD_KEY" = "true" ]; then
              echo "Signed **.aab** for Google Play and a debug **.apk** are under *Artifacts* below."
            else
              echo "Only the debug **.apk** was built. For the Google Play **.aab**, add the four upload-key secrets (see ANDROID.md)."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Airsoft Ops</title>
  <meta name="description" content="Airsoft game companion: bomb timer, VIP escort, search & destroy, battle royale, hostage rescue, infection and murder mystery with announcer and synced speakers.">
  <meta name="theme-color" content="#060a26">
  <meta name="color-scheme" content="dark">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Airsoft Ops">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Chakra+Petch:wght@600;700&family=Share+Tech+Mono&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="bgfx" aria-hidden="true"></div>
<div class="app">
  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
  <header class="top">
    <div class="brand"><span class="logo" id="logoSlot" aria-hidden="true"></span><span class="led" id="led" aria-hidden="true"></span><span class="bname">AIRSOFT <b>OPS</b></span></div>
    <div class="topr">
      <span class="net" id="net" hidden><i></i><b id="netCode"></b></span>
      <span class="chip" id="chip" data-i18n="chip.ready">Bereit</span>
      <button class="iconbtn langbtn" id="btnLang" type="button" data-i18n-aria="lang.switch"><span id="langLabel">DE</span></button>
      <button class="iconbtn" id="btnFs" type="button" data-i18n-aria="fs.on" hidden>
        <svg id="icoFsOn" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
        <svg id="icoFsOff" viewBox="0 0 24 24" aria-hidden="true" hidden><path d="M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5"/></svg>
      </button>
    </div>
  </header>

  <!-- HOME: choose a mode -->
  <section class="scr" id="scrHome">
    <div class="intro">
      <h1 data-i18n="home.title">Spielmodus wählen</h1>
      <p data-i18n="home.sub"></p>
    </div>
    <button class="banner" id="sessBanner" type="button" hidden><i></i><span id="sessBannerText"></span><b data-i18n="home.sessOpen">Verwalten</b></button>
    <div class="modegrid" id="modeGrid"></div>
  </section>

  <!-- LOBBY: one mode, its rules and settings -->
  <section class="scr" id="scrLobby" hidden>
    <button class="backbtn" id="btnBack" type="button"><span aria-hidden="true">‹</span> <span data-i18n="lobby.back">Alle Modi</span></button>
    <div class="hero">
      <div class="art big" id="lobbyArt"></div>
      <h1 id="lobbyName"></h1>
      <p id="lobbyDesc"></p>
    </div>
    <details class="how" open>
      <summary data-i18n="lobby.how">So läuft es</summary>
      <ol id="lobbyHow"></ol>
    </details>
    <h3 data-i18n="lobby.settings">Einstellungen</h3>

    <div class="modeset" data-mode="bomb">
      <div class="tgrid">
        <button class="tcard" type="button" data-key="roundTime"><span class="tl" data-i18n="bomb.roundTime"></span><span class="tv"></span><span class="td" data-i18n="bomb.roundTimeSub"></span></button>
        <button class="tcard" type="button" data-key="bombTime"><span class="tl" data-i18n="bomb.bombTime"></span><span class="tv"></span><span class="td" data-i18n="bomb.bombTimeSub"></span></button>
        <button class="tcard" type="button" data-key="plantTime"><span class="tl" data-i18n="bomb.plant"></span><span class="tv"></span><span class="td" data-i18n="bomb.plantSub"></span></button>
        <button class="tcard" type="button" data-key="defuseTime"><span class="tl" data-i18n="bomb.defuse"></span><span class="tv"></span><span class="td" data-i18n="bomb.defuseSub"></span></button>
      </div>
      <div class="group">
        <label class="row check"><div class="txt"><div class="lbl" data-i18n="bomb.half"></div><div class="desc" data-i18n="bomb.halfDesc"></div></div><span class="switch"><input type="checkbox" data-opt="half"><span></span></span></label>
      </div>
    </div>
    <div id="modeSets"></div>

    <button class="btn primary big" id="btnStart" type="button" data-i18n="lobby.start">Spiel starten</button>
    <p class="fine" id="lobbySess"></p>
    <p class="fine" id="wakeNote" data-i18n="lobby.wake"></p>
  </section>

  <!-- SESSION: host or join -->
  <section class="scr" id="scrSession" hidden>
    <div class="intro">
      <h1 data-i18n="sess.title">Session</h1>
      <p data-i18n="sess.sub"></p>
    </div>

    <div id="sessIdle" class="stack">
      <div class="card">
        <div class="card-h"><span class="card-ico">📡</span><div><div class="lbl" data-i18n="sess.hostTitle"></div><div class="desc" data-i18n="sess.hostDesc"></div></div></div>
        <button class="btn primary" id="btnHost" type="button" data-i18n="sess.hostBtn">Session starten</button>
        <p class="msg" id="hostMsg"></p>
      </div>

      <div class="card">
        <div class="card-h"><span class="card-ico">🔗</span><div><div class="lbl" data-i18n="sess.joinTitle"></div><div class="desc" data-i18n="sess.joinDesc"></div></div></div>
        <input class="codein" id="joinCode" type="text" inputmode="text" autocomplete="off" autocapitalize="characters" spellcheck="false" maxlength="4" data-i18n-ph="sess.codePh" data-i18n-aria="sess.code">
        <div class="field">
          <div class="lbl" data-i18n="sess.role"></div>
          <div class="seg wide" id="joinRole"><button type="button" data-v="speaker" data-i18n="role.speaker"></button><button type="button" data-v="player" data-i18n="role.player"></button><button type="button" data-v="viewer" data-i18n="role.viewer"></button></div>
          <div class="desc" id="roleDesc"></div>
        </div>
        <div class="field">
          <div class="lbl" data-i18n="sess.name"></div>
          <input class="namein wide" id="joinName" type="text" maxlength="24" autocomplete="off" data-i18n-ph="sess.nameDesc" data-i18n-aria="sess.name">
        </div>
        <button class="btn primary" id="btnJoin" type="button" data-i18n="sess.joinBtn">Beitreten</button>
        <p class="msg" id="joinMsg"></p>
      </div>
    </div>

    <div class="card host" id="sessHost" hidden>
      <div class="mp-top">
        <div>
          <div class="label" data-i18n="sess.code"></div>
          <div class="code" id="hostCode">----</div>
          <div class="desc" data-i18n="sess.qrHint"></div>
        </div>
        <div class="qr" id="hostQr"></div>
      </div>
      <button class="btn small ghost" id="btnShare" type="button" data-i18n="sess.share">Link teilen</button>
      <div class="members" id="members"></div>
      <button class="btn ghost danger" id="btnEndSession" type="button" data-i18n="sess.end">Session beenden</button>
    </div>
  </section>

  <!-- REMOTE: speaker / player / viewer between rounds -->
  <section class="scr" id="scrRemote" hidden>
    <div class="remote-card">
      <div class="label" id="remRole"></div>
      <div class="code" id="remCode">----</div>
      <div class="rem-status" id="remStatus"></div>
      <div class="desc" id="remHint"></div>
    </div>
    <button class="btn primary big" id="btnMyRole" type="button" data-i18n="rem.myRole" hidden>Meine Rolle ansehen</button>
    <button class="btn ghost" id="btnRemTest" type="button" data-i18n="rem.test">Ton &amp; Box testen</button>
    <button class="btn ghost danger" id="btnLeave" type="button" data-i18n="sess.leave">Session verlassen</button>
  </section>

  <!-- SETTINGS -->
  <section class="scr" id="scrSettings" hidden>
    <div class="intro"><h1 data-i18n="set.title">Einstellungen</h1></div>

    <h3 data-i18n="set.lang">Sprache</h3>
    <div class="group">
      <div class="row">
        <div class="txt"><div class="lbl" data-i18n="set.appLang"></div></div>
        <div class="seg" data-seg="lang"><button type="button" data-v="de">DE</button><button type="button" data-v="en">EN</button></div>
      </div>
      <div class="row">
        <div class="txt"><div class="lbl" data-i18n="set.voiceLang"></div></div>
        <div class="seg" data-seg="voiceLang"><button type="button" data-v="auto" data-i18n="set.voiceLangAuto"></button><button type="button" data-v="de">DE</button><button type="button" data-v="en">EN</button></div>
      </div>
    </div>

    <button class="btn ghost" id="btnTest" type="button" data-i18n="set.test">Ton &amp; Box testen</button>
    <p class="msg" id="testMsg"></p>

    <h3 data-i18n="set.announcer">Ansager</h3>
    <div class="group">
      <div class="row">
        <div class="txt"><div class="lbl" data-i18n="set.voice"></div><div class="desc" id="voiceDesc"></div></div>
        <div class="seg" data-seg="voice"><button type="button" data-v="male" data-i18n="set.voiceMale"></button><button type="button" data-v="device" data-i18n="set.voiceDevice"></button></div>
      </div>
      <label class="row check"><div class="txt"><div class="lbl" data-i18n="set.radio"></div><div class="desc" data-i18n="set.radioDesc"></div></div><span class="switch"><input type="checkbox" data-opt="radio"><span></span></span></label>
      <div class="row">
        <div class="txt"><div class="lbl" data-i18n="set.voiceVol"></div></div>
        <input type="range" data-range="voiceVol" min="10" max="100" step="5" data-i18n-aria="set.voiceVol">
      </div>
      <div class="row">
        <div class="txt"><div class="lbl" data-i18n="set.preview"></div><div class="desc" data-i18n="set.previewDesc"></div></div>
        <button class="btn small" id="btnVoiceTest" type="button" data-i18n="set.play">Abspielen</button>
      </div>
    </div>

    <h3 data-i18n="set.what">Was angesagt wird</h3>
    <div class="group">
      <label class="row check"><div class="txt"><div class="lbl" data-i18n="set.sayStart"></div><div class="desc" data-i18n="set.sayStartDesc"></div></div><span class="switch"><input type="checkbox" data-say="start"><span></span></span></label>
      <label class="row check"><div class="txt"><div class="lbl" data-i18n="set.sayPlanted"></div><div class="desc" data-i18n="set.sayPlantedDesc"></div></div><span class="switch"><input type="checkbox" data-say="planted"><span></span></span></label>
      <label class="row check"><div class="txt"><div class="lbl" data-i18n="set.sayMin1"></div><div class="desc" data-i18n="set.sayMin1Desc"></div></div><span class="switch"><input type="checkbox" data-say="min1"><span></span></span></label>
      <label class="row check"><div class="txt"><div class="lbl" data-i18n="set.sayBomb"></div><div class="desc" data-i18n="set.sayBombDesc"></div></div><span class="switch"><input type="checkbox" data-say="bomb"><span></span></span></label>
      <label class="row check"><div class="txt"><div class="lbl" data-i18n="set.sayEvents"></div><div class="desc" data-i18n="set.sayEventsDesc"></div></div><span class="switch"><input type="checkbox" data-say="events"><span></span></span></label>
      <label class="row check"><div class="txt"><div class="lbl" data-i18n="set.sayResult"></div><div class="desc" data-i18n="set.sayResultDesc"></div></div><span class="switch"><input type="checkbox" data-say="result"><span></span></span></label>
    </div>

    <h3 data-i18n="set.sounds">Sounds</h3>
    <div class="group">
      <div class="row">
        <div class="txt"><div class="lbl" data-i18n="set.vol"></div><div class="desc" data-i18n="set.volDesc"></div></div>
        <input type="range" data-range="vol" min="10" max="100" step="5" data-i18n-aria="set.vol">
      </div>
      <label class="row check"><div class="txt"><div class="lbl" data-i18n="set.tick"></div><div class="desc" data-i18n="set.tickDesc"></div></div><span class="switch"><input type="checkbox" data-snd="tick"><span></span></span></label>
      <label class="row check"><div class="txt"><div class="lbl" data-i18n="set.hold"></div><div class="desc" data-i18n="set.holdDesc"></div></div><span class="switch"><input type="checkbox" data-snd="hold"><span></span></span></label>
      <label class="row check"><div class="txt"><div class="lbl" data-i18n="set.signal"></div><div class="desc" data-i18n="set.signalDesc"></div></div><span class="switch"><input type="checkbox" data-snd="signal"><span></span></span></label>
      <label class="row check"><div class="txt"><div class="lbl" data-i18n="set.boom"></div></div><span class="switch"><input type="checkbox" data-snd="boom"><span></span></span></label>
      <label class="row check"><div class="txt"><div class="lbl" data-i18n="set.jingle"></div><div class="desc" data-i18n="set.jingleDesc"></div></div><span class="switch"><input type="checkbox" data-snd="jingle"><span></span></span></label>
      <label class="row check"><div class="txt"><div class="lbl" data-i18n="set.vibrate"></div><div class="desc" data-i18n="set.vibrateDesc"></div></div><span class="switch"><input type="checkbox" data-opt="vibrate"><span></span></span></label>
    </div>

    <h3 id="syncHead" data-i18n="set.sync" hidden>Synchronisation</h3>
    <div class="group" id="syncGroup" hidden>
      <div class="row">
        <div class="txt"><div class="lbl"><span data-i18n="set.lat"></span> <output class="val" id="latVal"></output></div><div class="desc" data-i18n="set.latDesc"></div></div>
        <input type="range" data-range="lat" min="0" max="500" step="10" data-i18n-aria="set.lat">
      </div>
      <label class="row check"><div class="txt"><div class="lbl" data-i18n="set.syncBeep"></div><div class="desc" data-i18n="set.syncBeepDesc"></div></div><span class="switch"><input type="checkbox" id="optSyncBeep"><span></span></span></label>
      <label class="row check" id="rowLocal"><div class="txt"><div class="lbl" data-i18n="set.local"></div><div class="desc" data-i18n="set.localDesc"></div></div><span class="switch"><input type="checkbox" data-opt="local"><span></span></span></label>
    </div>

    <h3 data-i18n="set.display">Anzeige</h3>
    <div class="group">
      <div class="row">
        <div class="txt"><div class="lbl" data-i18n="set.art"></div><div class="desc" data-i18n="set.artDesc"></div></div>
        <div class="seg" data-seg="art"><button type="button" data-v="ai" data-i18n="set.artAi"></button><button type="button" data-v="vector" data-i18n="set.artVec"></button></div>
      </div>
      <label class="row check" id="rowFs" hidden><div class="txt"><div class="lbl" data-i18n="set.fs"></div><div class="desc" data-i18n="set.fsDesc"></div></div><span class="switch"><input type="checkbox" data-opt="fs"><span></span></span></label>
      <div class="row">
        <div class="txt"><div class="lbl" data-i18n="set.reset"></div><div class="desc" data-i18n="set.resetDesc"></div></div>
        <button class="btn small" id="btnReset" type="button" data-i18n="set.resetBtn">Zurücksetzen</button>
      </div>
    </div>
  </section>

  <!-- BOMB: waiting for plant -->
  <section class="scr" id="scrRound" hidden>
    <div class="clockwrap">
      <div class="label" id="roundLabel"></div>
      <div class="clock" id="roundClock">10:00</div>
    </div>
    <div class="sites">
      <button class="hold site a" id="holdA" type="button" data-i18n-aria="bomb.plantA"><span class="fill"></span><span class="letter">A</span><span class="hint" id="hintA"></span></button>
      <button class="hold site b" id="holdB" type="button" data-i18n-aria="bomb.plantB"><span class="fill"></span><span class="letter">B</span><span class="hint" id="hintB"></span></button>
    </div>
    <button class="btn ghost danger" id="abortRound" type="button" data-i18n="game.abort">Runde abbrechen</button>
  </section>

  <!-- BOMB: planted -->
  <section class="scr" id="scrPlanted" hidden>
    <div class="planted-head"><span class="sitebadge" id="plantSite">A</span><span data-i18n="bomb.planted">Bombe platziert</span></div>
    <div class="clock bomb" id="bombClock">0:45</div>
    <div class="bar"><span id="bombBar"></span></div>
    <button class="hold defuse" id="holdDefuse" type="button" data-i18n-aria="bomb.defuseAria"><span class="fill"></span><span class="mark" id="halfMark"></span><span class="letter" data-i18n="bomb.defuseBig">ENTSCHÄRFEN</span><span class="hint" id="defuseHint"></span></button>
    <button class="btn ghost danger" id="abortPlanted" type="button" data-i18n="game.abort">Runde abbrechen</button>
  </section>

  <!-- OTHER GAME MODES (built by modes.js) -->
  <section class="scr" id="scrMode" hidden>
    <div class="modehead"><span class="art tiny" id="mIcon"></span><span id="mName"></span></div>
    <div class="clockwrap" id="mClockWrap">
      <div class="label" id="mClockLabel"></div>
      <div class="clock" id="mClock"></div>
    </div>
    <div class="mstatus" id="mStatus"></div>
    <div class="mbody" id="mBody"></div>
    <button class="btn ghost danger" id="abortMode" type="button" data-i18n="game.abort">Runde abbrechen</button>
  </section>

  <!-- END -->
  <section class="scr" id="scrEnd" hidden>
    <div class="result" id="result">
      <div class="rk" id="resKicker"></div>
      <h2 id="resTitle"></h2>
      <p id="resSub"></p>
    </div>
    <div class="endextra" id="endExtra"></div>
    <div class="endbtns">
      <button class="btn primary big" id="btnAgain" type="button" data-i18n="game.again">Neue Runde</button>
      <button class="btn ghost" id="btnSetup" type="button" data-i18n="game.back">Zurück zum Modus</button>
    </div>
  </section>
</div>

<nav class="tabbar" id="nav">
  <button type="button" data-tab="home"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4h7v7H4zM13 4h7v7h-7zM4 13h7v7H4zM13 13h7v7h-7z"/></svg><span data-i18n="nav.home">Modi</span></button>
  <button type="button" data-tab="session"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 13a2 2 0 1 0 0-4 2 2 0 0 0 0 4zM7.8 15.8a6 6 0 0 1 0-7.6M16.2 8.2a6 6 0 0 1 0 7.6M5 18.5a10 10 0 0 1 0-13M19 5.5a10 10 0 0 1 0 13"/></svg><span data-i18n="nav.session">Session</span><i class="dot" id="navDot" hidden></i></button>
  <button type="button" data-tab="settings"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h4M12 17h8M14 4v6M8 14v6"/></svg><span data-i18n="nav.settings">Einstellungen</span></button>
</nav>

<div class="sheet-bg" id="sheetBg" hidden>
  <div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="shTitle">
    <div class="sh-head">
      <div><h2 id="shTitle"></h2><p id="shDesc"></p></div>
      <button class="iconbtn" id="shClose" type="button" data-i18n-aria="sheet.close"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    </div>
    <div class="sh-val">
      <button class="rbtn" type="button" data-d="-1" data-i18n-aria="sheet.less">−</button>
      <output class="sh-out" id="shOut"></output>
      <button class="rbtn" type="button" data-d="1" data-i18n-aria="sheet.more">+</button>
    </div>
    <input type="range" class="ruler" id="shRange" min="0" max="10" step="1" data-i18n-aria="sheet.value">
    <div class="sh-scale"><span id="shMin"></span><span id="shMax"></span></div>
    <div class="sh-presets" id="shPresets"></div>
    <button class="btn primary big" id="shDone" type="button" data-i18n="sheet.done">Fertig</button>
  </div>
</div>

<div class="sheet-bg" id="cardBg" hidden>
  <div class="sheet rolecard" role="dialog" aria-modal="true" aria-labelledby="cardWho">
    <div class="sh-head">
      <div><h2 id="cardWho"></h2><p data-i18n="card.secret"></p></div>
      <button class="iconbtn" id="cardClose" type="button" data-i18n-aria="sheet.close"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    </div>
    <button class="reveal" id="cardReveal" type="button">
      <span class="rv-frame" id="cardFrame" aria-hidden="true"></span>
      <span class="rv-cover"><span class="rv-back" id="cardBack"></span><span class="rv-tap" data-i18n="card.tap"></span></span>
      <span class="rv-body" id="cardBody"></span>
    </button>
    <div class="card-acts" id="cardActs"></div>
    <button class="btn primary big" id="cardDone" type="button" data-i18n="card.done"></button>
  </div>
</div>

<script src="vendor/qrcode.js"></script>
<script src="i18n.js"></script>
<script src="art.js"></script>
<script src="modes.js"></script>
<script src="app.js"></script>
</body>
</html>
